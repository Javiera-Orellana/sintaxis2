}
function esc(s){return String(s).replace(/'/g,"\\'");}

/* ── QR CODE ─────────────────────────────────────── */
function qrSvg(size,id){
  size=size||180; id=id||'CM-04821';
  var cols=21,seed=0;
  for(var i=0;i<id.length;i++) seed+=id.charCodeAt(i);
  var rects='';
  var cell=size/cols;
  for(var idx=0;idx<cols*cols;idx++){
    var r=Math.floor(idx/cols),c=idx%cols;
    var inC=(r<7&&c<7)||(r<7&&c>=cols-7)||(r>=cols-7&&c<7);
    var filled;
    if(inC){var rr=r<7?r:r-(cols-7),cc=c<7?c:c-(cols-7);filled=(rr===0||rr===6||cc===0||cc===6)||(rr>=2&&rr<=4&&cc>=2&&cc<=4);}
    else{seed=(seed*1664525+1013904223)&0x7fffffff;filled=(seed/0x7fffffff)>0.48;}
    if(filled) rects+='<rect x="'+(c*cell+0.5)+'" y="'+(r*cell+0.5)+'" width="'+(cell-1)+'" height="'+(cell-1)+'" fill="'+C.navy+'" rx="0.8"/>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block">'+rects+'</svg>';
}

/* ── HEAT MAP ────────────────────────────────────── */
function heatSvg(selId,clickable){

  var stk={high:'rgba(180,16,30,0.8)',med:'rgba(180,110,0,0.8)',low:'rgba(15,80,40,0.8)'};
  var lines='';
  var yy=[30,70,110,150,190,230];for(var i=0;i<yy.length;i++) lines+='<line x1="0" y1="'+yy[i]+'" x2="360" y2="'+yy[i]+'" stroke="#B8C8D6" stroke-width="7"/>';
  var xx=[36,86,136,186,236,286,326];for(var j=0;j<xx.length;j++) lines+='<line x1="'+xx[j]+'" y1="0" x2="'+xx[j]+'" y2="270" stroke="#B8C8D6" stroke-width="7"/>';
  var zs='';
  for(var k=0;k<ZONAS.length;k++){
    var z=ZONAS[k],w=z.w,h=z.h;
    var fc=heat[z.lv]||heat.low,sc=selId===z.id?'white':(stk[z.lv]||stk.low),sw=selId===z.id?2.5:1.5;
    var oc=clickable?' onclick="selZ(\''+esc(z.id)+'\')' +'" style="cursor:pointer"':' style="cursor:default"';
    zs+='<g'+oc+'><rect x="'+z.x+'" y="'+z.y+'" width="'+w+'" height="'+h+'" rx="8" fill="'+fc+'" stroke="'+sc+'" stroke-width="'+sw+'"/>'
      +'<text x="'+(z.x+w/2)+'" y="'+(z.y+h/2-4)+'" text-anchor="middle" font-size="9" font-weight="700" fill="white">'+z.n+'</text>'
      +'<text x="'+(z.x+w/2)+'" y="'+(z.y+h/2+9)+'" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.85)">'+z.v+' vendedores</text></g>';
  }
  return '<svg width="100%" viewBox="0 0 360 270" style="display:block"><rect width="360" height="270" fill="#C8D4DF"/>'+lines+zs
    +'<circle cx="182" cy="155" r="10" fill="'+C.accent+'" opacity="0.95"/><circle cx="182" cy="155" r="20" fill="'+C.accent+'" opacity="0.18"/><circle cx="182" cy="155" r="3.5" fill="white"/></svg>';
}

/* ── PIN MAP ─────────────────────────────────────── */
function pinSvg(pins,ux,uy){

  var lines='';
  var yy2=[28,68,108,148,188];for(var i=0;i<yy2.length;i++) lines+='<line x1="0" y1="'+yy2[i]+'" x2="360" y2="'+yy2[i]+'" stroke="#B8C8D6" stroke-width="6"/>';
  var xx2=[36,86,136,186,236,286,326];for(var j=0;j<xx2.length;j++) lines+='<line x1="'+xx2[j]+'" y1="0" x2="'+xx2[j]+'" y2="220" stroke="#B8C8D6" stroke-width="6"/>';
  var ps='';
  for(var k=0;k<pins.length;k++){
    var p=pins[k],col=p.col||C.accent;
    var oc=p.fn?' onclick="'+p.fn+'" style="cursor:pointer"':' style="cursor:default"';
    ps+='<g'+oc+'><ellipse cx="'+p.x+'" cy="'+(p.y+2)+'" rx="7" ry="3" fill="rgba(0,0,0,0.18)"/>'
      +'<path d="M'+p.x+','+(p.y-2)+' C'+(p.x-13)+','+(p.y-16)+' '+(p.x-13)+','+(p.y-34)+' '+p.x+','+(p.y-38)+' C'+(p.x+13)+','+(p.y-34)+' '+(p.x+13)+','+(p.y-16)+' '+p.x+','+(p.y-2)+'" fill="'+col+'"/>'
      +'<circle cx="'+p.x+'" cy="'+(p.y-23)+'" r="8" fill="white"/>'
      +'<text x="'+p.x+'" y="'+(p.y-19)+'" text-anchor="middle" font-size="9" font-weight="800" fill="'+col+'">'+p.lbl+'</text></g>';
  }
  return '<svg width="100%" viewBox="0 0 360 220" style="display:block"><rect width="360" height="220" fill="#C8D4DF"/>'+lines+ps
    +'<circle cx="'+ux+'" cy="'+uy+'" r="10" fill="'+C.navy+'" opacity="0.92"/><circle cx="'+ux+'" cy="'+uy+'" r="20" fill="'+C.navy+'" opacity="0.18"/><circle cx="'+ux+'" cy="'+uy+'" r="3.5" fill="white"/></svg>';
}

  var rank=TIENDAS.slice().sort(function(a,b){return(b.max-b.lib)-(a.max-a.lib);});

      +[[H0.length,'Reubicaciones hoy','+12% vs ayer','accent'],[okCnt,'Exitosas hoy',(H0.length-okCnt)+' fallidas','ok'],[okCnt*30,'Puntos entregados',okCnt+'×30 pts','info'],[crit.length,'Zonas críticas','de '+ZONAS.length+' totales',crit.length>0?'err':'ok']].map(function(r){

        +'<div style="font-size:12px;font-weight:800;color:'+C.err+';margin-bottom:8px;">⚠️ Zonas Críticas · Nivel Rojo</div>'

      var t=rank[k];
      var medal=k===0?C.accent:k===1?'#E6EEF6':C.bg;
      var medalTxt=k===0?'#fff':k===1?C.navy:C.textL;
      content+='<div style="'+cs('padding:11px 14px;')+'">'
        +'<div style="display:flex;align-items:center;gap:12px;">'
        +'<div style="width:30px;height:30px;border-radius:50%;flex-shrink:0;background:'+medal+';display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:'+medalTxt+';">'+(k+1)+'</div>'
        +'<div style="flex:1;"><div style="font-size:13px;font-weight:700;color:'+C.text+';">'+t.n+'</div><div style="font-size:11px;color:'+C.textM+';">'+t.sec+' · ⭐ '+t.r+'</div></div>'
        +'<div style="text-align:right;"><div style="font-size:18px;font-weight:900;color:'+C.accent+';">'+(t.max-t.lib)+'</div><div style="font-size:10px;color:'+C.textL+';">en uso</div></div></div></div>';
    }
  } else if(S.adTab==='mapa'){
    content='<div style="'+cs('padding:0;overflow:hidden;')+'">'+heatSvg(null,false)
      +'<div style="padding:6px 12px 10px;display:flex;gap:12px;">'
      +'<div style="display:flex;align-items:center;gap:5px;"><div style="width:9px;height:9px;border-radius:2px;background:#E8192C;"></div><span style="font-size:10px;color:'+C.textM+';">Crítico</span></div>'
      +'<div style="display:flex;align-items:center;gap:5px;"><div style="width:9px;height:9px;border-radius:2px;background:#FFA200;"></div><span style="font-size:10px;color:'+C.textM+';">Moderado</span></div>'
      +'<div style="display:flex;align-items:center;gap:5px;"><div style="width:9px;height:9px;border-radius:2px;background:#1A6E3C;"></div><span style="font-size:10px;color:'+C.textM+';">Óptimo</span></div>'
      +'</div></div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
      +[[ZONAS.length,'Zonas monitoreadas'],[TIENDAS.length,'Tiendas activas'],[crit.length,'Zonas críticas'],(function(){var s=0;for(var i=0;i<TIENDAS.length;i++)s+=TIENDAS[i].lib;return [s,'Cupos libres totales'];})()].map(function(r){
        return '<div style="'+cs('text-align:center;padding:14px 10px;')+'"><div style="font-size:24px;font-weight:900;color:'+C.navy+';">'+r[0]+'</div><div style="font-size:11px;color:'+C.textM+';margin-top:2px;">'+r[1]+'</div></div>';
      }).join('')+'</div>';
  } else {
    content='<div style="'+cs('')+'"><div style="font-size:14px;font-weight:800;color:'+C.text+';margin-bottom:12px;">Parámetros del sistema</div>'
      +[['Cupos máx. por tienda','10 espacios'],['Horas máx. de jornada','8 horas'],['Puntos por reubicación','30 pts'],['Umbral zona crítica','30 vendedores'],['Fiscalizadores en turno','4 activos']].map(function(r,idx){
        return '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:'+(idx<4?'1px solid '+C.bdr:'none')+';"><span style="font-size:13px;color:'+C.textM+';">'+r[0]+'</span><span style="font-size:13px;font-weight:800;color:'+C.text+';">'+r[1]+'</span></div>';
      }).join('')+'</div>';
  }

  var now=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
  var header='<div class="nheader">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;">'
    +'<div><div style="font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;">Administrador</div>'
    +'<div style="font-size:17px;font-weight:800;color:#fff;">Panel de Control</div></div>'
    +'<button onclick="doLogout()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-size:12px;color:#fff;cursor:pointer;font-weight:700;">Salir</button></div>'
    +'<div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;">'
    +'<span style="font-size:11px;color:rgba(255,255,255,.45);">'+now+'</span>'
    +'<div style="display:flex;align-items:center;gap:6px;"><div style="width:7px;height:7px;border-radius:50%;background:#3DCC80;"></div><span style="font-size:10px;color:rgba(255,255,255,.55);font-weight:600;">Sistema activo</span></div>'
    +'</div></div>';

  return '<div class="view">'+header+'<div class="scroll">'+content+'</div>'
    +bnav([{id:'dashboard',ic:'📊',lb:'Dashboard'},{id:'mapa',ic:'🗺️',lb:'Mapa'},{id:'config',ic:'⚙️',lb:'Config'}],S.adTab)+'</div>';
}

/* ── RENDER ──────────────────────────────────────── */
function render(){
  var m=document.getElementById('main');
  if(!S.role) m.innerHTML=loginHTML();
  else if(S.role==='fiscal') m.innerHTML=fiscHTML();
  else if(S.role==='comerciante') m.innerHTML=comHTML();
  else if(S.role==='ancla') m.innerHTML=anclaHTML();
  else if(S.role==='admin') m.innerHTML=adminHTML();
}

/* ── ACCIONES ────────────────────────────────────── */
function hideLerr(){var e=document.getElementById('lerr');if(e)e.style.display='none';}

function doLogin(){
  var u=(document.getElementById('lu').value||'').trim().toLowerCase();
  var p=document.getElementById('lp').value||'';
  var ok={admin:'123',fiscal:'123',comerciante:'123',ancla:'123'};
  if(ok[u]===p){S.role=u;render();}
  else{var e=document.getElementById('lerr');if(e)e.style.display='block';}
}
function quickLogin(r){S.role=r;render();}
function doLogout(){resetState();render();}

function setTab(id){
  if(S.role==='fiscal')S.fTab=id;
  else if(S.role==='comerciante')S.cTab=id;
  else if(S.role==='ancla')S.aTab=id;
  else if(S.role==='admin')S.adTab=id;
  render();
}

function selZ(id){
  S.fZ=null;for(var i=0;i<ZONAS.length;i++)if(ZONAS[i].id===id){S.fZ=ZONAS[i];break;}
  S.fTab='inicio';render();
}
function selSt(id){
  S.cS=null;for(var i=0;i<TIENDAS.length;i++)if(TIENDAS[i].id===id){S.cS=TIENDAS[i];break;}
  render();
}

function doScan(){
  if(S.fStep===0){S.fStep=1;render();setTimeout(function(){S.fStep=2;render();},1400);}
  else if(S.fStep===2){S.fStep=0;render();}
}
function regReloc(){
  var t=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  S.fHist.unshift({id:'h'+Date.now(),n:'Carlos Muñoz',rut:'12.345.678-9',t:t,ok:true,dest:'La Vega'});
  S.fStep=0;S.fTab='historial';render();
}

function finJornada(uid){
  S.aV=S.aV.filter(function(v){return v.uid!==uid;});
  if(S.aCupos<10)S.aCupos++;render();
}
function chCupos(d){var n=S.aCupos+d;if(n>=0&&n<=10){S.aCupos=n;render();}}

/* ── INIT ────────────────────────────────────────── */
render();
</script>
</body>
</html>
